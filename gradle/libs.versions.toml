[versions]
# ── Build toolchain ───────────────────────────────────────────────────────────
agp             = "8.13.2"
kotlin          = "2.3.0"
ksp             = "2.3.3"
# ── Core Android ─────────────────────────────────────────────────────────────
coreKtx                 = "1.17.0"
lifecycleRuntimeKtx     = "2.10.0"
activityCompose         = "1.12.2"
# ── Compose ───────────────────────────────────────────────────────────────────
composeBom      = "2026.01.00"
# ── Navigation ────────────────────────────────────────────────────────────────
navigation      = "2.9.6"
hiltNavigation  = "1.3.0"
# ── Dependency Injection ──────────────────────────────────────────────────────
hilt            = "2.58"
hiltTesting     = "2.58"
# ── Serialization ─────────────────────────────────────────────────────────────
serializationJson = "1.9.0"
# ── Machine Learning ──────────────────────────────────────────────────────────
tensorflowLite  = "2.17.0"
# ── Unit Testing ─────────────────────────────────────────────────────────────
junit              = "4.13.2"
mockitoCore         = "5.11.0"
mockitoKotlin       = "5.3.1"
coroutinesTest      = "1.8.1"
turbine             = "1.1.0"
# ── Instrumented Testing ──────────────────────────────────────────────────────
junitVersion    = "1.3.0"
espressoCore    = "3.7.0"

[libraries]
# ── Core Android ─────────────────────────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",          name = "core-ktx",                version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose       = { group = "androidx.activity",      name = "activity-compose",        version.ref = "activityCompose" }

# ── Compose (BOM + UI) ────────────────────────────────────────────────────────
# Import the BOM as a platform dependency in build.gradle.kts:
#   implementation(platform(libs.androidx.compose.bom))
# All other compose-* entries below are version-less — the BOM resolves them.
androidx-compose-bom        = { group = "androidx.compose",           name = "compose-bom",           version.ref = "composeBom" }
androidx-ui                 = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics        = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling         = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3          = { group = "androidx.compose.material3", name = "material3" }

# ── Navigation ────────────────────────────────────────────────────────────────
navigation-compose      = { module = "androidx.navigation:navigation-compose",      version.ref = "navigation" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose",       version.ref = "hiltNavigation" }

# ── Dependency Injection ──────────────────────────────────────────────────────
hilt-android    = { module = "com.google.dagger:hilt-android",  version.ref = "hilt" }
hilt-compiler   = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# ── Serialization ─────────────────────────────────────────────────────────────
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# ── Machine Learning ──────────────────────────────────────────────────────────
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }

# ── Unit Testing ─────────────────────────────────────────────────────────────
junit                   = { group = "junit",                    name = "junit",                   version.ref = "junit" }
mockito-core            = { group = "org.mockito",              name = "mockito-core",            version.ref = "mockitoCore" }
mockito-kotlin          = { group = "org.mockito.kotlin",       name = "mockito-kotlin",          version.ref = "mockitoKotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine                 = { group = "app.cash.turbine",         name = "turbine",                 version.ref = "turbine" }

# ── Instrumented Testing ──────────────────────────────────────────────────────
androidx-junit              = { group = "androidx.test.ext",       name = "junit",           version.ref = "junitVersion" }
androidx-espresso-core      = { group = "androidx.test.espresso",  name = "espresso-core",   version.ref = "espressoCore" }
androidx-ui-test-junit4     = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
androidx-ui-test-manifest   = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
hilt-android-testing        = { group = "com.google.dagger",       name = "hilt-android-testing", version.ref = "hiltTesting" }
hilt-compiler-androidtest   = { group = "com.google.dagger",       name = "hilt-compiler",        version.ref = "hiltTesting" }
mockito-android             = { group = "org.mockito",             name = "mockito-android",      version.ref = "mockitoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]

# testImplementation(libs.bundles.unitTest)
unitTest = [
    "junit",
    "mockito-core",
    "mockito-kotlin",
    "kotlinx-coroutines-test",
    "turbine",
]

# androidTestImplementation(libs.bundles.androidTest)
androidTest = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-ui-test-junit4",
    "hilt-android-testing",
    "mockito-android",
    "mockito-kotlin",
    "kotlinx-coroutines-test",
]